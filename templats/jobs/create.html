{% extends 'base.html' %}

{% block title %}
Add Application
{% endblock %}

{% block content %}

<div class="card shadow">

  <div class="card-header bg-success text-white">

    <h3>Add Job Application</h3>

  </div>

  <div class="card-body">

    <form method="POST">

      {% csrf_token %}

      {% for field in form %}

      <div class="mb-3">

        <label class="form-label">

          {{ field.label }}

        </label>

        {{ field }}

        {% if field.errors %}

        <div class="text-danger small mt-1">

          {{ field.errors }}

        </div>

        {% endif %}

      </div>

      {% endfor %}

      <button class="btn btn-success">

        Save Application

      </button>

      <a href="{% url 'job_list' %}" class="btn btn-secondary">

        Cancel

      </a>

    </form>

  </div>

</div>

{% endblock %}
